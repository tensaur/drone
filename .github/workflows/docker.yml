name: docker

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            base_image: nvcr.io/nvidia/cuda:13.0.2-cudnn-devel-ubuntu24.04
            torch_index: https://download.pytorch.org/whl/cu130
            target: base
          - backend: cpu
            base_image: ubuntu:24.04
            torch_index: https://download.pytorch.org/whl/cpu
            target: base
          - backend: cuda-jupyter
            base_image: nvcr.io/nvidia/cuda:13.0.2-cudnn-devel-ubuntu24.04
            torch_index: https://download.pytorch.org/whl/cu130
            target: jupyter
          - backend: cpu-jupyter
            base_image: ubuntu:24.04
            torch_index: https://download.pytorch.org/whl/cpu
            target: jupyter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          target: ${{ matrix.target }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            TORCH_INDEX_URL=${{ matrix.torch_index }}
          tags: ghcr.io/${{ github.repository }}:${{ matrix.backend }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.backend }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.backend }},mode=max
