name: docker

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            arch: amd64
            runner: ubuntu-24.04
            base_image: nvcr.io/nvidia/cuda:13.0.2-cudnn-devel-ubuntu24.04
            nccl: "libnccl2 libnccl-dev"
            torch_index: https://download.pytorch.org/whl/cu130
          - backend: cpu
            arch: amd64
            runner: ubuntu-24.04
            base_image: ubuntu:24.04
            nccl: ""
            torch_index: https://download.pytorch.org/whl/cpu
          - backend: cpu
            arch: arm64
            runner: ubuntu-24.04-arm
            base_image: ubuntu:24.04
            nccl: ""
            torch_index: https://download.pytorch.org/whl/cpu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            NCCL_PACKAGES=${{ matrix.nccl }}
            TORCH_INDEX_URL=${{ matrix.torch_index }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ matrix.backend }}-${{ matrix.arch }}
          cache-to:   type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache-${{ matrix.backend }}-${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.backend }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, cpu]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.backend }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY_IMAGE }}:${{ matrix.backend }} \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
