[base]
package = ocean
env_name = puffer_drone
policy_name = Policy
rnn_name = Recurrent

[policy]
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[vec]
num_envs = 8

[env]
task = HOVER
num_envs = 16
num_drones = 64
max_rings = 10
alpha_dist = 1.0
alpha_omega = 0.001

hover_target_dist = 10.0
hover_dist = 0.1
hover_omega = 0.1
hover_vel = 0.1

[train]
total_timesteps = 200_000_000

[sweep.env.alpha_dist]
distribution = log_normal
min = 0.001
max = 1.0
mean = 0.95
scale = auto

[sweep.env.alpha_omega]
distribution = log_normal
min = 0.000001
max = 1.0
mean = 0.001
scale = auto

